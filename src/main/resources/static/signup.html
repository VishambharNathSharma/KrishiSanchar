<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrishiSanchar - Sign Up</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="login-container" style="max-width: 600px;">
    <div class="login-card">

        <div class="login-header">
            <h2>KrishiSanchar</h2>
            <p>Create your account and set up your farm profile.</p>
        </div>

        <form id="signupForm">

            <!-- Profile Photo Preview Section -->
           <!-- Profile Photo Section with Local Upload -->
<div class="input-group" style="align-items: center; text-align: center; margin-bottom: 20px;">
    <label style="margin-bottom: 8px; font-weight: 600;">Profile Photo</label>
    <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 10px;">
        <img id="profile-preview" src="images/default-avatar.png" alt="Profile Preview" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #0b4a2e; background-color: #f0f0f0;">
    </div>
    <!-- File input for local upload -->
    <input type="file" id="localImageInput" name="imageFile" accept="image/*" style="font-size: 13px;">
    <!-- Hidden input to store either Google URL or local file name -->
    <input type="hidden" id="picture-hidden-input" name="profilePicture">
</div>

            <h4 style="margin-bottom: 15px; color: #0b4a2e; border-bottom: 1px solid #eee; padding-bottom: 5px;">Account Details</h4>

            <div class="form-row">
                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                </div>
                <div class="input-group">
                    <label for="userId">Email or Phone Number</label>
                    <input type="text" id="userId" name="userId" placeholder="Email or Phone" required>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
                </div>
            </div>

            <h4 style="margin-top: 10px; margin-bottom: 15px; color: #0b4a2e; border-bottom: 1px solid #eee; padding-bottom: 5px;">Farm Details</h4>

            <div class="form-row">
                <div class="input-group">
                    <label for="location">Location (State/District)</label>
                    <input type="text" id="location" name="location" placeholder="e.g., Delhi" required>
                </div>
                <div class="input-group">
                    <label for="landArea">Land Area (Acres)</label>
                    <input type="number" id="landArea" name="landArea" step="0.1" placeholder="e.g., 5.5" required>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="primaryCrop">Primary Crop</label>
                    <select id="primaryCrop" name="primaryCrop" required>
                        <option value="" disabled selected>Select a crop</option>
                        <option value="Wheat">Wheat</option>
                        <option value="Paddy">Paddy / Rice</option>
                        <option value="Maize">Maize</option>
                        <option value="Cotton">Cotton</option>
                        <option value="Sugarcane">Sugarcane</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="soilType">Soil Type</label>
                    <select id="soilType" name="soilType" required>
                        <option value="" disabled selected>Select soil type</option>
                        <option value="Loamy">Loamy</option>
                        <option value="Clay">Clay</option>
                        <option value="Sandy">Sandy</option>
                        <option value="Black">Black Soil</option>
                        <option value="Alluvial">Alluvial</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="irrigationSource">Irrigation Source</label>
                <select id="irrigationSource" name="irrigationSource" required>
                    <option value="" disabled selected>Select irrigation source</option>
                    <option value="Tube Well">Tube Well</option>
                    <option value="Canal">Canal</option>
                    <option value="Rainfed">Rainfed (Monsoon)</option>
                    <option value="Drip Irrigation">Drip Irrigation</option>
                </select>
            </div>

            <div class="form-actions" style="margin-bottom: 20px;">
                <label class="remember-me">
                    <input type="checkbox" name="terms" required> I agree to the <a href="#" style="color: #0b4a2e; text-decoration: none;">Terms & Conditions</a>
                </label>
            </div>

            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <button type="button" class="btn-google">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="google-icon">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Sign up with Google
        </button>

        <p class="signup-prompt">
            Already have an account? <a href="login.html">Log in here</a>
        </p>

    </div>
</div>
<script src="js/auth.js"></script>
</body>
</html>
